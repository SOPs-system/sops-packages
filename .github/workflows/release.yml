name: Release private NuGet packages
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: sops-package-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: python3 eng/packages.py plan --github-output "$GITHUB_OUTPUT"
  publish:
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            11.0.x
      - name: Configure private feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget update source github-sops --username "${{ github.actor }}" --password "$env:GH_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore solution
        run: dotnet restore SOPs.Packages.sln --configfile NuGet.Config
      - name: Build solution
        run: dotnet build SOPs.Packages.sln -c Release --no-restore
      - name: Test solution
        run: dotnet test SOPs.Packages.sln -c Release --no-build --no-restore
      - name: Pack versioned package
        shell: pwsh
        run: |
          dotnet pack "${{ matrix.project }}" -c Release --no-restore -p:PackageVersion=${{ matrix.version }} --output artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem artifacts -Filter '*.nupkg' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one NuGet package' }
          dotnet nuget push $files[0].FullName --source https://nuget.pkg.github.com/SOPs-system/index.json --api-key "$env:GH_TOKEN" --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tag successful publication
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "${{ matrix.tag }}" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "refs/tags/${{ matrix.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
